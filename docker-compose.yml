services:
  postgres:
    image: postgres:16
    container_name: careergraph-postgres

    environment:
      POSTGRES_DB: careergraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: careergraph_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careergraph"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: careergraph-backend

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:careergraph_password@postgres:5432/careergraph

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-CareerGraph}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000

    container_name: careergraph-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data:
